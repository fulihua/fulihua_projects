<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易信息展示页面</title>
    <style>
        
        body {
            background-color: #f0f0f0; 
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto; 
            padding: 20px;
        }

       
        h1 {
            text-align: center; 
            color: #003366; 
        }

       
        p {
            line-height: 1.8; 
        }

        
        #showBtn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        
        #showBtn:hover {
            background-color: #45a049; /* 悬浮时背景变化 */
        }
    </style>
</head>
<body>
    <h1>欢迎来到信息展示页面</h1>
    <p>这是第一段正文内容，用于展示页面的基础文本信息。这里可以放置任意说明性文字，帮助用户理解页面的用途。</p>
    <p>这是第二段正文内容，和第一段一样，行高设置为1.8倍，保证阅读的舒适性。你可以根据需要修改这里的文字内容。</p>
    <button id="showBtn">点击我</button>

    <script>
        // 获取按钮元素
        const btn = document.getElementById('showBtn');
        // 绑定点击事件
        btn.addEventListener('click', function() {
            alert('页面加载完成！');
        });
    </script>
</body>
</html>
